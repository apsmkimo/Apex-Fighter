name: Android Debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.4.1

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cd ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz && rm templates.tpz
          # 只保留 Android 範本，快取比較小
          mv templates/android_* templates/version.txt ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf templates

      - name: Configure Android export (SDK, JDK, debug keystore)
        run: |
          keytool -genkeypair -v -keystore ~/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          GODOT_MINOR=$(echo "$GODOT_VERSION" | cut -d. -f1,2)
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_MINOR}.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          sed -i 's/^ *//' ~/.config/godot/editor_settings-${GODOT_MINOR}.tres
          cat ~/.config/godot/editor_settings-${GODOT_MINOR}.tres

      - name: Import project
        run: ~/godot/godot --headless --path . --import || true

      - name: Smoke test (autopilot clears stage 1)
        run: |
          ~/godot/godot --headless --fixed-fps 60 --path . --scene res://tests/smoke_test.tscn | tee smoke.log
          grep -q "\[test\] PASS" smoke.log

      - name: Export debug APK
        run: |
          mkdir -p build
          ~/godot/godot --headless --path . --export-debug "Android" build/apex-fighter-debug.apk
          ls -la build
          test -f build/apex-fighter-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apex-fighter-debug-apk
          path: build/apex-fighter-debug.apk
          if-no-files-found: error

      # main 分支每次推送都更新「debug-latest」預先發行版，手機可以直接下載 APK
      - name: Publish to debug-latest pre-release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Debug build (latest main)
          prerelease: true
          make_latest: false
          body: "自動建置的 debug APK，commit ${{ github.sha }}。手機直接下載 apex-fighter-debug.apk 安裝。"
          files: build/apex-fighter-debug.apk
